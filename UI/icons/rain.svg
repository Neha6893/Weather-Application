<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="rainCloudG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78909C"/>
      <stop offset="100%" stop-color="#455A64"/>
    </linearGradient>
    <linearGradient id="dropG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90CAF9"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <filter id="rcShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#37474F" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Cloud -->
  <g filter="url(#rcShadow)">
    <ellipse cx="60" cy="52" rx="36" ry="21" fill="url(#rainCloudG)"/>
    <circle cx="36" cy="52" r="18" fill="url(#rainCloudG)"/>
    <circle cx="60" cy="40" r="22" fill="url(#rainCloudG)"/>
    <circle cx="82" cy="51" r="16" fill="url(#rainCloudG)"/>
  </g>
  <!-- Rain drops -->
  <g fill="url(#dropG)">
    <ellipse cx="36" cy="83" rx="4" ry="7"/>
    <ellipse cx="52" cy="90" rx="4" ry="7"/>
    <ellipse cx="68" cy="83" rx="4" ry="7"/>
    <ellipse cx="84" cy="90" rx="4" ry="7"/>
  </g>
  <!-- Drop highlights -->
  <g fill="white" opacity="0.4">
    <ellipse cx="34" cy="80" rx="1.5" ry="2.5"/>
    <ellipse cx="50" cy="87" rx="1.5" ry="2.5"/>
    <ellipse cx="66" cy="80" rx="1.5" ry="2.5"/>
    <ellipse cx="82" cy="87" rx="1.5" ry="2.5"/>
  </g>
</svg>