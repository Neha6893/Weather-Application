<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="cloudG1" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </linearGradient>
    <linearGradient id="cloudG2" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <filter id="cs1">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#78909C" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Back cloud -->
  <g opacity="0.75">
    <ellipse cx="75" cy="60" rx="30" ry="18" fill="url(#cloudG1)"/>
    <circle cx="55" cy="60" r="15" fill="url(#cloudG1)"/>
    <circle cx="73" cy="50" r="18" fill="url(#cloudG1)"/>
    <circle cx="90" cy="58" r="13" fill="url(#cloudG1)"/>
  </g>
  <!-- Front cloud -->
  <g filter="url(#cs1)">
    <ellipse cx="52" cy="75" rx="34" ry="20" fill="url(#cloudG2)"/>
    <circle cx="28" cy="75" r="17" fill="url(#cloudG2)"/>
    <circle cx="50" cy="63" r="21" fill="url(#cloudG2)"/>
    <circle cx="72" cy="73" r="16" fill="url(#cloudG2)"/>
  </g>
  <ellipse cx="44" cy="62" rx="10" ry="5" fill="white" opacity="0.5"/>
</svg>
