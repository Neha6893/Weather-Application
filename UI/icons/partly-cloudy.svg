<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="sunGradPC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <filter id="cloudShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#90A4AE" flood-opacity="0.4"/>
    </filter>
    <filter id="sunGlowPC">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Sun (behind cloud) -->
  <g opacity="0.95">
    <g stroke="#FFAB00" stroke-width="3" stroke-linecap="round">
      <line x1="38" y1="10" x2="40" y2="20"/>
      <line x1="10" y1="38" x2="20" y2="40"/>
      <line x1="6"  y1="56" x2="16" y2="56"/>
      <line x1="56" y1="6"  x2="56" y2="16"/>
      <line x1="17" y1="17" x2="24" y2="24"/>
    </g>
    <circle cx="44" cy="44" r="22" fill="url(#sunGradPC)" filter="url(#sunGlowPC)"/>
    <ellipse cx="37" cy="37" rx="7" ry="5" fill="white" opacity="0.25"/>
  </g>
  <!-- Cloud -->
  <g filter="url(#cloudShadow)">
    <ellipse cx="72" cy="80" rx="34" ry="19" fill="url(#cloudGrad)"/>
    <circle cx="50" cy="78" rx="16" r="16" fill="url(#cloudGrad)"/>
    <circle cx="68" cy="68" r="20" fill="url(#cloudGrad)"/>
    <circle cx="87" cy="76" r="15" fill="url(#cloudGrad)"/>
  </g>
  <ellipse cx="62" cy="66" rx="8" ry="4" fill="white" opacity="0.5"/>
</svg>